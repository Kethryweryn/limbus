name: CI

# Les tests tournent sur les PR ; la fusion dans main ne fait que déployer (ADR-0023) : la protection
# de main exige les vérifications `changes` et `check`, sur une branche à jour avec main.
# Documentation seule : pas de déploiement (paths-ignore), et `check` est ignoré sur la PR (ADR-0022).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:

permissions:
  contents: read

jobs:
  # Vérification obligatoire elle aussi : si elle échoue, `check` serait ignoré, donc compté comme réussi
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Autre chose que de la documentation ?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          if echo "$files" | grep -qvE '^(doc/.*|[^/]+\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: limbus
          POSTGRES_PASSWORD: limbus
          POSTGRES_DB: limbus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U limbus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://limbus:limbus@localhost:5432/limbus_test
      TEST_DATABASE_URL: postgresql://limbus:limbus@localhost:5432/limbus_test
      PUBLIC_APP_URL: https://limbuslarp.fr
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Traces Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Le commit de main est celui que la CI de la PR a testé (branche à jour exigée) : pas de second passage
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Jamais deux déploiements en parallèle, et on ne coupe pas un déploiement en cours
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Déployer le commit validé
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # Tolère une clé collée depuis Windows (fins de ligne CRLF, BOM)
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' | sed '1s/^\xEF\xBB\xBF//' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Clé d'hôte épinglée : on refuse tout autre serveur
          echo 'limbuslarp.fr ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMkspHzioErwvXaWQ6j2PTKPOafoIwTxwYObxlxr44F+' > ~/.ssh/known_hosts
          # Côté serveur, cette clé ne peut lancer que deploy.sh, avec ce commit en argument
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@limbuslarp.fr "$GITHUB_SHA"

      - name: Vérifier que le site répond
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' https://limbuslarp.fr/api/auth/me) && [ "$status" = 200 ] && exit 0
            sleep 5
          done
          echo "Le site ne répond pas après le déploiement (dernier statut : $status)"
          exit 1
